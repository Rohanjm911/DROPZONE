<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="100%" height="260">
  <defs>
    <style>
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes typeLine1 {
        0% { opacity: 0; transform: translateY(4px); }
        15% { opacity: 1; transform: translateY(0); }
        100% { opacity: 1; }
      }
      @keyframes typeLine2 {
        0%, 15% { opacity: 0; transform: translateY(4px); }
        35% { opacity: 1; transform: translateY(0); }
        100% { opacity: 1; }
      }
      @keyframes typeLine3 {
        0%, 35% { opacity: 0; transform: translateY(4px); }
        55% { opacity: 1; transform: translateY(0); }
        100% { opacity: 1; }
      }
      @keyframes typeLine4 {
        0%, 55% { opacity: 0; transform: translateY(4px); }
        75% { opacity: 1; transform: translateY(0); }
        100% { opacity: 1; }
      }
      @keyframes typeLine5 {
        0%, 75% { opacity: 0; transform: translateY(4px); }
        90% { opacity: 1; transform: translateY(0); }
        100% { opacity: 1; }
      }
      @keyframes termProgress {
        0%, 55% { width: 0px; }
        75% { width: 180px; }
        90%, 100% { width: 240px; }
      }

      .line-1 { animation: typeLine1 8s infinite; }
      .line-2 { animation: typeLine2 8s infinite; }
      .line-3 { animation: typeLine3 8s infinite; }
      .line-4 { animation: typeLine4 8s infinite; }
      .line-5 { animation: typeLine5 8s infinite; }
      .term-bar { animation: termProgress 8s infinite; }
      .cursor { animation: blinkCursor 0.8s infinite; }

      .term-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .t-cyan { fill: #38bdf8; font-weight: 700; }
      .t-green { fill: #10b981; font-weight: 700; }
      .t-yellow { fill: #fbbf24; font-weight: 700; }
      .t-dim { fill: #64748b; }
      .t-magenta { fill: #c084fc; font-weight: 700; }
    </style>
  </defs>

  <!-- Terminal Window Frame -->
  <rect x="2" y="2" width="836" height="256" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Window Header Bar -->
  <path d="M 2 14 C 2 7 7 2 14 2 L 826 2 C 833 2 838 7 838 14 L 838 36 L 2 36 Z" fill="#0f172a"/>
  <line x1="2" y1="36" x2="838" y2="36" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Control Dots -->
  <circle cx="22" cy="19" r="6" fill="#ef4444"/>
  <circle cx="42" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="62" cy="19" r="6" fill="#10b981"/>

  <text x="420" y="23" text-anchor="middle" font-family="monospace" font-size="12" fill="#64748b">dropzone-cli — zsh (DZP1 Session)</text>

  <!-- Terminal Output Lines -->
  <g transform="translate(24, 66)">
    <!-- Line 1: Discovery -->
    <g class="line-1">
      <text x="0" y="0" class="term-text">
        <tspan class="t-cyan">dropzone&gt;</tspan> discovery start --mdns
      </text>
      <text x="0" y="22" class="term-text">
        <tspan class="t-green">[DISCOVERED]</tspan> MacBook-Pro (192.168.1.18:52490) <tspan class="t-dim">• Identity: X25519 Verified</tspan>
      </text>
    </g>

    <!-- Line 2: Cryptographic Handshake & SAS PIN -->
    <g class="line-2">
      <text x="0" y="52" class="term-text">
        <tspan class="t-cyan">dropzone&gt;</tspan> pairing verify --target "MacBook-Pro"
      </text>
      <text x="0" y="74" class="term-text">
        <tspan class="t-yellow">[SAS PIN]</tspan> <tspan class="t-magenta">482 190</tspan> <tspan class="t-dim">(Verify Short Authentication String on both screens)</tspan> <tspan class="t-green">[MATCHED ✓]</tspan>
      </text>
    </g>

    <!-- Line 3: Transfer Initiation -->
    <g class="line-3">
      <text x="0" y="104" class="term-text">
        <tspan class="t-cyan">dropzone&gt;</tspan> send --target "MacBook-Pro" --file "Enterprise-Data-2026.iso" (4.2 GB)
      </text>
      <text x="0" y="126" class="term-text">
        <tspan class="t-green">[ENCRYPTION]</tspan> ChaCha20-Poly1305 AEAD <tspan class="t-dim">• Forward Secrecy Established</tspan>
      </text>
    </g>

    <!-- Line 4: Streaming Progress Bar -->
    <g class="line-4">
      <text x="0" y="156" class="term-text">
        <tspan class="t-green">[STREAMING]</tspan> [
      </text>
      <rect x="110" y="145" width="240" height="12" rx="2" fill="#1e293b"/>
      <rect x="110" y="145" width="0" height="12" rx="2" fill="#38bdf8" class="term-bar"/>
      <text x="360" y="156" class="term-text">
        ] <tspan class="t-cyan">100%</tspan> • <tspan class="t-green">1.48 GB/s</tspan> <tspan class="t-dim">ETA: 0s</tspan>
      </text>
    </g>

    <!-- Line 5: Verification & Ledger -->
    <g class="line-5">
      <text x="0" y="178" class="term-text">
        <tspan class="t-green">[INTEGRITY]</tspan> SHA-256 Checksum: <tspan class="t-magenta">e3b0c44298fc...38b</tspan> [VALID] <tspan class="t-dim">• Audit Block #1408 Committed</tspan>
        <tspan class="cursor" fill="#38bdf8"> █</tspan>
      </text>
    </g>
  </g>
</svg>
